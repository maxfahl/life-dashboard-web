<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title data-id="th-modified">Life Dashboard</title><style>
:root{--sand:#f4efec;--paper:#fff;--ink:#251f21;--muted:#6d6668;--line:#eae6e7;--teal:#4d8e7d;--teal-soft:#e3f0ec;--red:#c93442;--red-soft:#fff0f1;--shadow:0 24px 64px rgba(55,41,45,.10)}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1180px;margin:32px auto;padding:0 18px}.app{background:var(--paper);min-height:calc(100vh - 64px);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.top{padding:34px 38px 0}.eyebrow,.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1{font-family:Georgia,serif;font-weight:400;font-size:42px;line-height:1.05;letter-spacing:-.035em;margin:7px 0 9px}.intro{max-width:720px;color:var(--muted);margin:0 0 22px}.nav{display:flex;gap:26px;overflow:auto;border-bottom:1px solid var(--line);padding:0 38px}.nav button{border:0;background:none;padding:15px 0 13px;font:inherit;color:var(--muted);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}.nav button.active{color:var(--ink);border-color:var(--teal)}main{padding:30px 38px 44px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden}.stat{padding:20px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat strong{display:block;font-family:Georgia,serif;font-size:30px;line-height:1.1;font-weight:400;letter-spacing:-.03em}.stat em{display:block;color:var(--muted);font-size:12px;font-style:normal;margin-top:8px}.danger{color:var(--red)!important}.known{color:var(--teal)!important}.section{margin-top:34px}.section h2{font-family:Georgia,serif;font-size:25px;font-weight:400;letter-spacing:-.025em;margin:5px 0 16px}.callout{padding:16px 18px;border-radius:12px;background:var(--teal-soft);margin-top:18px}.callout.warn{background:var(--red-soft)}.callout strong{display:block;margin-bottom:4px}.track{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.track>div{border-top:1px solid var(--line);padding-top:13px}.track strong{font-size:22px;display:block}.track span{font-size:13px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px}.input,select{width:100%;border:1px solid #d7d1d2;border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink);font:inherit;min-height:44px}.list{border-top:1px solid var(--line)}.tx{border-bottom:1px solid var(--line)}.tx summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 2px;list-style:none}.tx summary::-webkit-details-marker{display:none}.tx b{display:block}.meta{font-size:12px;color:var(--muted)}.amount{font-weight:700;white-space:nowrap}.detail{padding:0 2px 16px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}.decision{display:grid;grid-template-columns:1fr minmax(160px,240px) auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}button.primary,button.secondary{border:0;border-radius:8px;padding:11px 15px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--ink);color:#fff}button.secondary{background:var(--teal-soft);color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}.rows .row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}.num{width:26px;height:26px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:12px}.row strong{display:block}.empty{padding:26px;border:1px dashed #ccc;border-radius:14px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:20px 38px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:14px}.login{max-width:520px;margin:12vh auto;background:#fff;padding:34px;border-radius:24px;box-shadow:var(--shadow)}.login h1{font-size:36px}.login form{display:flex;gap:10px;margin-top:22px}.error{color:var(--red);font-size:13px;margin-top:12px}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:350px;z-index:4}.bars{display:flex;gap:8px;align-items:end;height:180px;padding:16px 0 4px}.bar{flex:1;min-width:54px;background:var(--sand);border-radius:6px 6px 0 0;position:relative}.bar i{position:absolute;inset:auto 0 100%;font-size:11px;text-align:center;font-style:normal}.bar span{position:absolute;top:100%;left:0;right:0;font-size:11px;text-align:center;color:var(--muted);padding-top:5px}.muted{color:var(--muted)}.sync{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}@media(max-width:800px){.shell{margin:0;padding:0}.app{border-radius:0;min-height:100vh}.top{padding:24px 20px 0}h1{font-size:34px}.nav{padding:0 20px;gap:22px}main{padding:24px 20px 36px}.grid{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.track{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.decision{grid-template-columns:1fr}.footer{padding:18px 20px;display:block}.login{margin:0;min-height:100vh;border-radius:0;padding:28px 20px}.login form{display:block}.login button{width:100%;margin-top:10px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)!important}.stat:last-child{border:0!important}.stat strong{font-size:27px}.tx summary{align-items:start}.amount{font-size:13px}.row{grid-template-columns:28px 1fr!important}.row>span:last-child{grid-column:2}}
</style><meta property="og:title" content="Life Dashboard" data-id="th-modified" ><meta name="description" content="Private owner-only Life Dashboard"></head><body><div id="root"></div><script>
const URL='https://kvbzadmmbqzlvzzcutwc.supabase.co',KEY='sb_publishable_rHVonLfrbUkrn5VcD77paA_Raoscwti',APP='https://maxfahl.github.io/life-dashboard-web/';
let session=null,state={tx:[],cycle:null,inputs:[],categories:[],plans:[],docs:[],sync:[],cycles:[],subs:[],balances:[]};const root=document.getElementById('root');const money=new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:2});
function parseSession(){const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);const access=h.get('access_token')||localStorage.getItem('life_access'),refresh=h.get('refresh_token')||localStorage.getItem('life_refresh');if(access){localStorage.setItem('life_access',access);if(refresh)localStorage.setItem('life_refresh',refresh);history.replaceState({},'',location.pathname);session={access,refresh};}else if(h.get('error_description')||q.get('error_description')){showLogin(decodeURIComponent(h.get('error_description')||q.get('error_description')).replace(/\+/g,' '))}return session}
async function api(path,{method='GET',body,schema='budget'}={}){let r=await fetch(URL+path,{method,headers:{apikey:KEY,Authorization:'Bearer '+session.access,'Accept-Profile':schema,'Content-Profile':schema,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401&&session.refresh){const x=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh})});if(x.ok){const j=await x.json();session={access:j.access_token,refresh:j.refresh_token};localStorage.setItem('life_access',session.access);localStorage.setItem('life_refresh',session.refresh);return api(path,{method,body,schema})}}if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||`Request failed (${r.status})`);return r.status===204?null:r.json()}
function showLogin(err=''){const sentAt=Number(localStorage.getItem('life_magic_sent_at')||0),cooling=Date.now()-sentAt<3600000;root.innerHTML=`<section class="login"><div class="eyebrow">Private access</div><h1>Life Dashboard</h1><p class="muted">Live budget data, decisions and analysis. Access is restricted to Max's verified email.</p><form id="login"><input class="input" required type="email" value="max.erik.fahl@gmail.com" aria-label="Email"><button class="primary" ${cooling?'disabled':''}>${cooling?'Sign-in link already sent':'Email me a sign-in link'}</button></form><div id="msg" class="${err?'error':'muted'}">${err||(cooling?'Use the newest email we sent. Supabase allows two sign-in emails per hour, so the button stays locked for an hour.':'Supabase allows two sign-in emails per hour. One tap is enough.')}</div></section>`;root.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),email=e.target.querySelector('input').value;if(b.disabled)return;b.disabled=true;b.textContent='Sending…';try{const r=await fetch(URL+'/auth/v1/otp',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,options:{emailRedirectTo:APP,shouldCreateUser:true}})});if(!r.ok){const j=await r.json().catch(()=>({}));if(r.status===429||/rate limit/i.test(j.msg||''))throw new Error('Two sign-in emails have already been sent this hour. Wait for the limit to reset, then tap once.');throw new Error(j.msg||'Could not send link')}localStorage.setItem('life_magic_sent_at',String(Date.now()));document.getElementById('msg').className='muted';document.getElementById('msg').textContent='Check your email and use the newest link. This button is locked for an hour to prevent another limit.';b.textContent='Sign-in link sent'}catch(x){document.getElementById('msg').className='error';document.getElementById('msg').textContent=x.message;b.disabled=false;b.textContent='Email me a sign-in link'}}}
async function load(){try{const [cycles,tx,inputs,categories,plans,docs,sync,subs,balances]=await Promise.all([api('/rest/v1/v_current_cycle?select=*&order=cycle_start.desc'),api('/rest/v1/v_dashboard_transactions?select=*&order=booking_date.desc&limit=1000'),api('/rest/v1/v_dashboard_cycle_inputs?select=*&order=created_at'),api('/rest/v1/category_decisions?select=category_key,label&status=eq.confirmed&order=label'),api('/rest/v1/v_dashboard_plans?select=*&order=created_at.desc'),api('/rest/v1/v_dashboard_documents?select=*&order=created_at.desc'),api('/rest/v1/v_dashboard_sync?select=*&limit=10'),api('/rest/v1/v_subscription_review_ready?select=*'),api('/rest/v1/v_dashboard_current_balances?select=*&order=safe_account_label')]);state={cycles,cycle:cycles[0],tx,inputs,categories,plans,docs,sync,subs,balances};render()}catch(e){if(/JWT|401|expired/i.test(e.message)){localStorage.clear();showLogin('Your session expired. Sign in again.')}else showLogin(e.message)}}
const flow={spend:'Spending',own_transfer:'Own transfer',inflow_unclear:'Unclear inflow',outflow_unclear:'Unmatched outflow',refund:'Refund'};const m=x=>money.format(Number(x||0));
function nav(){return ['today','transactions','decisions','subscriptions','plans','history','about'].map((x,i)=>`<button data-page="${x}" class="${i?'':'active'}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function txRow(x){return `<details class="tx"><summary><span><b>${esc(x.display_label||'No merchant or note')}</b><span class="meta">${x.booking_date} · ${x.safe_account_label} · ${flow[x.flow_kind]||x.flow_kind}</span></span><span class="amount">${['spend','outflow_unclear'].includes(x.flow_kind)?'-':''}${m(x.amount)}</span></summary><div class="detail"><span>Category: ${esc(x.category_key||'Not approved')}</span><span>Status: ${esc(x.category_status)}</span>${x.anomaly_reason?`<span>Review: ${esc(x.anomaly_reason)}</span>`:''}<code>${x.id.slice(0,8)}</code></div></details>`}
function render(){const c=state.cycle;if(!c)return showLogin('No current cycle found.');const currentBalance=state.balances.reduce((n,x)=>n+Number(x.available_amount||0),0),balanceAsOf=state.balances.map(x=>x.reference_date).filter(Boolean).sort().pop(),spend=state.tx.filter(x=>x.flow_kind==='spend'),elapsed=Math.max(1,Math.floor((Date.now()-new Date(c.cycle_start+'T00:00:00').getTime())/86400000)+1),days=Math.floor((new Date(c.cycle_end)-new Date(c.cycle_start))/86400000)+1,pace=Number(c.booked_spend)/elapsed*days,uncat=spend.filter(x=>x.category_status==='uncategorized'),unclear=state.tx.filter(x=>x.flow_kind.includes('unclear')),weeks={};spend.forEach(x=>{const d=new Date(x.booking_date+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);const k=d.toISOString().slice(5,10);weeks[k]=(weeks[k]||0)+Number(x.amount)});const max=Math.max(...Object.values(weeks),1);root.innerHTML=`<div class="shell"><div class="app"><header class="top"><div class="eyebrow">Live · owner only</div><h1>Life Dashboard</h1><p class="intro">What you have, where it went, what needs attention and whether you are on track.</p></header><nav class="nav">${nav()}</nav><main>
<section class="page active" data-page="today"><div class="grid"><div class="stat"><small>Available now</small><strong class="known">${m(currentBalance)}</strong><em>${balanceAsOf?`Bank balance as of ${balanceAsOf.slice(0,10)}`:'Bank balance unavailable'}</em></div><div class="stat"><small>Accounts included</small><strong>${state.balances.length}</strong><em>${state.balances.map(x=>`${x.safe_account_label} ${m(x.available_amount)}`).join(' + ')}</em></div><div class="stat"><small>Cycle</small><strong>${c.cycle_start.slice(5)} – ${c.cycle_end.slice(5)}</strong><em>Starts on the 25th, ends on the 24th</em></div><div class="stat"><small>Needs a category</small><strong>${uncat.length}</strong><em>Booked transactions only</em></div></div><div class="section"><div class="label">Budget history under review</div><h2>Current balance is the source of truth</h2><div class="callout warn"><strong>Cycle-spend totals are temporarily hidden.</strong>The bank feed duplicated pending card entries during repeated syncs, so the earlier remaining and booked-spend figures were misleading. Pending entries are now excluded from the dashboard while the historical cycle ledger is reconciled.</div></div><div class="section"><div class="label">Where it went</div><h2>Spending by week</h2><div class="bars">${Object.entries(weeks).map(([k,v])=>`<div class="bar" style="height:${Math.max(8,v/max*145)}px"><i>${m(v)}</i><span>${k}</span></div>`).join('')}</div></div><div class="section"><div class="label">Source health</div><h2 class="sync"><span class="dot"></span>${state.sync[0]?.status==='succeeded'?'Bank sync healthy':'Check bank sync'}</h2><p class="muted">Last completed ${fmt(state.sync.find(x=>x.finished_at)?.finished_at)}. The dashboard reads current Supabase data on every open and refresh.</p><button class="secondary" id="refresh">Refresh now</button></div></section>
<section class="page" data-page="transactions"><div class="section" style="margin-top:0"><div class="label">Explore</div><h2>Transactions</h2><div class="controls"><input id="search" class="input" placeholder="Search merchant, date or amount"><select id="flow"><option value="">All flows</option>${Object.entries(flow).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="account"><option value="">Both accounts</option><option>Privatkonto</option><option>Spar</option></select></div><p id="count" class="muted"></p><div id="txlist" class="list"></div></div></section>
<section class="page" data-page="decisions"><div class="label">Protected action</div><h2>${uncat.length} transactions need a category</h2><p class="muted">Only categories already confirmed in the canonical budget system can be applied. Every change records user identity, old and new values, time and source.</p>${state.categories.length?`<div class="list">${uncat.map(x=>`<div class="decision"><div><b>${esc(x.display_label)}</b><div class="meta">${x.booking_date} · ${x.id.slice(0,8)} · ${m(x.amount)}</div></div><select aria-label="Category for ${esc(x.display_label)}"><option value="">Choose confirmed category</option>${state.categories.map(c=>`<option value="${esc(c.category_key)}">${esc(c.label)}</option>`).join('')}</select><button class="primary approve" data-id="${x.id}">Approve</button></div>`).join('')}</div>`:`<div class="empty">No categories have been confirmed yet. The first category still requires the existing iMessage approval workflow.</div>`}<div class="section"><div class="label">Needs review</div><h2>${unclear.length} unclear flows</h2><div class="list">${unclear.map(txRow).join('')}</div></div></section>
<section class="page" data-page="subscriptions"><div class="label">Monthly review</div><h2>${state.subs.length?state.subs.length+' candidates':'No candidates yet'}</h2>${state.subs.length?`<div class="rows">${state.subs.map((x,i)=>row(i+1,x.display_merchant,`${x.occurrence_count} occurrences · confidence ${Math.round(x.confidence*100)}%`,m(x.typical_amount))).join('')}</div>`:`<div class="empty">Confirmed subscriptions stay separate from likely recurring charges. Nothing is confirmed or cancelled without review.</div>`}</section>
<section class="page" data-page="plans"><div class="label">Purchase plan</div><h2>${state.plans.length} current intents</h2><div class="rows">${state.plans.map((x,i)=>row(i+1,x.item,`${x.room||'No room'} · ${x.decision_status}${x.notes?' · '+x.notes:''}`,x.target_price?m(x.target_price):'')).join('')}</div><div class="callout"><strong>Context, not booked spending.</strong>Plans do not count against the budget until a real bank transaction is booked. ${state.docs.length} receipt documents are currently linked.</div></section>
<section class="page" data-page="history"><div class="label">Cycle history</div><h2>Budget cycles</h2><div class="empty">Historical cycle totals are hidden while duplicated pending entries are reconciled. The current bank balance above remains live.</div><div class="section"><div class="label">Starting composition</div><h2>Current cycle inputs</h2><div class="rows">${state.inputs.filter(x=>x.cycle_id===c.id).map((x,i)=>row(i+1,x.label,`${x.input_kind} · ${x.safe_account_label}`,m(x.amount))).join('')}</div></div></section>
<section class="page" data-page="about"><div class="label">One shell, real modules</div><h2>Designed to grow without fake panels</h2><div class="callout"><strong>Budget is the first complete module.</strong>Home projects, open loops, people, routines and health context can join when their data contracts and privacy rules are ready.</div><div class="section"><div class="label">Data and privacy</div><h2>Supabase is canonical</h2><div class="track"><div><strong>Live</strong><span>refreshes from Supabase</span></div><div><strong>Owner-only</strong><span>email allowlist and authenticated data API</span></div><div><strong>Traceable</strong><span>protected RPC and correction history</span></div></div><p class="muted">Notion remains the curated layer. iMessage remains the first-category and anomaly channel. Bank data remains read-only. No service key, bank credential or full account number reaches this browser.</p></div><button class="secondary" id="signout">Sign out</button></section>
</main><footer class="footer"><span>Private to Max · Life System Supabase</span><span>Loaded ${new Date().toLocaleString('sv-SE',{timeZone:'Europe/Stockholm'})} Stockholm time</span></footer></div></div>`;bind();filterTx()}
function row(i,a,b,c){return `<div class="row"><span class="num">${i}</span><span><strong>${esc(a)}</strong><span class="meta">${esc(b)}</span></span><span>${c||''}</span></div>`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(x){return x?new Date(x).toLocaleString('sv-SE',{timeZone:'Europe/Stockholm'}):'not available'}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector(`.page[data-page="${b.dataset.page}"]`).classList.add('active');scrollTo(0,0)});['search','flow','account'].forEach(id=>document.getElementById(id)?.addEventListener('input',filterTx));document.getElementById('refresh').onclick=load;document.getElementById('signout').onclick=async()=>{try{if(session&&session.access)await fetch(URL+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access}})}catch(e){}localStorage.clear();session=null;showLogin()};document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{const sel=b.previousElementSibling;if(!sel.value)return toast('Choose an approved category first.');if(!confirm(`Apply “${sel.options[sel.selectedIndex].text}” to this transaction? This is recorded in correction history.`))return;b.disabled=true;try{await api('/rest/v1/rpc/apply_category_decision',{method:'POST',body:{p_transaction_id:b.dataset.id,p_category_key:sel.value}});toast('Category confirmed and correction recorded.');await load()}catch(e){toast(e.message)}finally{b.disabled=false}})}
function filterTx(){const q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('flow')?.value||'',a=document.getElementById('account')?.value||'';const xs=state.tx.filter(x=>(!f||x.flow_kind===f)&&(!a||x.safe_account_label===a)&&(`${x.display_label} ${x.booking_date} ${x.amount}`).toLowerCase().includes(q));const el=document.getElementById('txlist');if(el)el.innerHTML=xs.slice(0,200).map(txRow).join('')||'<div class="empty">No transactions match.</div>';const count=document.getElementById('count');if(count)count.textContent=`${xs.length} of ${state.tx.length} transactions${xs.length>200?' · showing first 200':''}`}
function toast(s){const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),3500)}
async function boot(){const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);const th=q.get('token_hash');if(th){root.innerHTML='<section class="login"><div class="eyebrow">Private access</div><h1>Life Dashboard</h1><p class="muted">Your sign-in link is ready. One tap finishes signing in.</p><button class="primary" id="confirm-signin" style="width:100%">Sign in to Life Dashboard</button></section>';document.getElementById('confirm-signin').onclick=async ev=>{const b=ev.target;b.disabled=true;b.textContent='Signing in...';try{const r=await fetch(URL+'/auth/v1/verify',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({type:q.get('type')||'magiclink',token_hash:th})});const j=await r.json().catch(()=>({}));if(r.ok&&j.access_token){localStorage.setItem('life_access',j.access_token);if(j.refresh_token)localStorage.setItem('life_refresh',j.refresh_token);session={access:j.access_token,refresh:j.refresh_token};history.replaceState({},'',location.pathname);load()}else{b.disabled=false;b.textContent='Sign in to Life Dashboard';showLogin(j.error_description||j.msg||'That sign-in link is invalid or has expired. Request a new one below.')}}catch(e){b.disabled=false;b.textContent='Sign in to Life Dashboard';showLogin('Could not verify the sign-in link. Check your connection and try again.')}};return}if(parseSession())load();else showLogin()}
boot();
</script></body></html>
